services:
  web:
    build: .
    container_name: django_app
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    restart: always
    healthcheck:
      # Python one-liner → avoids installing curl/wget in slim image
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readiness/').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s   # gives AWS RDS extra startup time

  nginx:
    image: nginx:stable
    container_name: django_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      web:
        condition: service_healthy
    restart: always
    healthcheck:
      # nginx has wget built-in
      test: ["CMD", "wget", "-qO-", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  static_volume:
  media_volume:
