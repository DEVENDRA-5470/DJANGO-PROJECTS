version: "3.9"

services:
  web:
    build: .
    container_name: mera_django_app
    command: >
      bash -c "
        echo 'Waiting for RDS...';
        sleep 10;
        echo 'RDS is ready!';
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn Library_Management.wsgi:application --bind 0.0.0.0:8000
      "
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    restart: always
