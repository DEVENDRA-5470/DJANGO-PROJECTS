services:
  web:
    build: .
    container_name: django_app
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    restart: always

  nginx:
    image: nginx:stable
    container_name: django_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: always

volumes:
  static_volume:
  media_volume:
